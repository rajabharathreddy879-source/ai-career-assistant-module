openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AI Career Assistant API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: chat
    description: Chat and messaging operations
  - name: resumes
    description: Resume management
  - name: reports
    description: Reports and roadmaps
  - name: dashboard
    description: Dashboard statistics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/sync:
    post:
      operationId: syncUser
      tags: [auth]
      summary: Sync Supabase user to local profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileSync"
      responses:
        "200":
          description: Profile synced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          description: Bad request

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard statistics for the authenticated user
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /chat/sessions:
    get:
      operationId: listChatSessions
      tags: [chat]
      summary: List all chat sessions for a user
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of chat sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatSession"
    post:
      operationId: createChatSession
      tags: [chat]
      summary: Create a new chat session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionInput"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSession"

  /chat/sessions/{sessionId}:
    get:
      operationId: getChatSession
      tags: [chat]
      summary: Get a chat session with its messages
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Chat session with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSessionDetail"
        "404":
          description: Session not found
    delete:
      operationId: deleteChatSession
      tags: [chat]
      summary: Delete a chat session and its messages
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Session deleted
        "404":
          description: Session not found

  /chat/history:
    delete:
      operationId: clearChatHistory
      tags: [chat]
      summary: Delete all chat sessions for a user
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        "204":
          description: History cleared

  /chat/message:
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Send a message and get AI response (SSE streaming)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "200":
          description: AI response (text/event-stream)
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Validation error

  /resumes:
    get:
      operationId: listResumes
      tags: [resumes]
      summary: List all resumes for a user
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of resumes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resume"
    post:
      operationId: createResume
      tags: [resumes]
      summary: Save a resume
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumeInput"
      responses:
        "201":
          description: Resume saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resume"

  /resumes/{resumeId}:
    patch:
      operationId: updateResume
      tags: [resumes]
      summary: Update a resume
      parameters:
        - name: resumeId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumeUpdate"
      responses:
        "200":
          description: Resume updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resume"
        "404":
          description: Resume not found
    delete:
      operationId: deleteResume
      tags: [resumes]
      summary: Delete a resume
      parameters:
        - name: resumeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Resume deleted
        "404":
          description: Resume not found

  /reports:
    get:
      operationId: listReports
      tags: [reports]
      summary: List all reports/roadmaps for a user
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"
    post:
      operationId: createReport
      tags: [reports]
      summary: Save a report or roadmap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "201":
          description: Report saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"

  /reports/{reportId}:
    delete:
      operationId: deleteReport
      tags: [reports]
      summary: Delete a report
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Report deleted
        "404":
          description: Report not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Profile:
      type: object
      required: [id, email, created_at]
      properties:
        id:
          type: string
        email:
          type: string
        full_name:
          type: ["string", "null"]
        created_at:
          type: string

    ProfileSync:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
        email:
          type: string
        full_name:
          type: ["string", "null"]

    DashboardStats:
      type: object
      required: [total_sessions, total_messages, resumes_count, reports_count, recent_sessions]
      properties:
        total_sessions:
          type: number
        total_messages:
          type: number
        resumes_count:
          type: number
        reports_count:
          type: number
        recent_sessions:
          type: array
          items:
            $ref: "#/components/schemas/ChatSession"

    ChatSession:
      type: object
      required: [id, user_id, title, created_at, message_count]
      properties:
        id:
          type: string
        user_id:
          type: string
        title:
          type: string
        created_at:
          type: string
        message_count:
          type: number

    ChatSessionDetail:
      type: object
      required: [id, user_id, title, created_at, messages]
      properties:
        id:
          type: string
        user_id:
          type: string
        title:
          type: string
        created_at:
          type: string
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"

    ChatMessage:
      type: object
      required: [id, session_id, role, message, created_at]
      properties:
        id:
          type: string
        session_id:
          type: string
        role:
          type: string
          enum: [user, assistant, system]
        message:
          type: string
        created_at:
          type: string

    SessionInput:
      type: object
      required: [user_id, title]
      properties:
        user_id:
          type: string
        title:
          type: string

    ChatMessageInput:
      type: object
      required: [session_id, user_id, message]
      properties:
        session_id:
          type: string
        user_id:
          type: string
        message:
          type: string
          minLength: 1
          maxLength: 4000
        resume_text:
          type: ["string", "null"]
        job_description:
          type: ["string", "null"]
        history:
          type: array
          items:
            $ref: "#/components/schemas/HistoryMessage"

    HistoryMessage:
      type: object
      required: [role, message]
      properties:
        role:
          type: string
          enum: [user, assistant]
        message:
          type: string

    Resume:
      type: object
      required: [id, user_id, name, content, created_at, updated_at]
      properties:
        id:
          type: string
        user_id:
          type: string
        name:
          type: string
        content:
          type: string
        created_at:
          type: string
        updated_at:
          type: string

    ResumeInput:
      type: object
      required: [user_id, name, content]
      properties:
        user_id:
          type: string
        name:
          type: string
        content:
          type: string

    ResumeUpdate:
      type: object
      properties:
        name:
          type: string
        content:
          type: string

    Report:
      type: object
      required: [id, user_id, title, content, report_type, priority, created_at]
      properties:
        id:
          type: string
        user_id:
          type: string
        title:
          type: string
        content:
          type: string
        report_type:
          type: string
          enum: [resume_analysis, ats_optimization, skill_gap, roadmap, interview_prep, general]
        priority:
          type: string
          enum: [Low, Medium, High, Critical]
        created_at:
          type: string

    ReportInput:
      type: object
      required: [user_id, title, content, report_type, priority]
      properties:
        user_id:
          type: string
        title:
          type: string
        content:
          type: string
        report_type:
          type: string
          enum: [resume_analysis, ats_optimization, skill_gap, roadmap, interview_prep, general]
        priority:
          type: string
          enum: [Low, Medium, High, Critical]
